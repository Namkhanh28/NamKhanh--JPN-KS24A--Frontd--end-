<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Môn Học</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Pop-up modal */
        .modal {
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 400px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .close {
            cursor: pointer;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        .form-group .radio-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .radio-group input {
            margin-right: 5px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn-cancel {
            background: white;
            border: 1px solid #ccc;
            color: black;
        }

        .btn-primary {
            background: #007bff;
            color: white;
        }

        .btn:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="modal">
        <div class="modal-content">
            <div class="modal-header">
                Thêm mới môn học
                <span class="close">×</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="subject-name">Tên môn học</label>
                    <input type="text" id="subject-name" placeholder="Nhập tên môn học">
                </div>
                <div class="form-group">
                    <label>Trạng thái</label>
                    <div class="radio-group">
                        <label><input type="radio" name="status" checked> Đang hoạt động</label>
                        <label><input type="radio" name="status"> Ngừng hoạt động</label>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-cancel">Hủy</button>
                <button class="btn btn-primary">Thêm</button>
            </div>
        </div>
    </div>

   
</body>
</html>
