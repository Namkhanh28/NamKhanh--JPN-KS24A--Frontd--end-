<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản</title>
    <link rel="stylesheet" href="../CSS/register.css">
</head>
<body>
    <div class="register-container">
        <h2 class="register-title">Đăng ký tài khoản</h2>
        <p class="register-subtitle">Đăng ký tài khoản để sử dụng dịch vụ</p>

        <form class="register-form">
            <div class="name-group">
                <div class="input-group">
                    <label for="lastname">Họ và tên đệm</label>
                    <input type="text" id="lastname" placeholder="Nhập họ và tên đệm">
                </div>
                <div class="input-group">
                    <label for="firstname">Tên</label>
                    <input type="text" id="firstname" placeholder="Nhập tên">
                </div>
            </div>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@company.com">

            <label for="password">Mật khẩu</label>
            <input type="password" id="password" placeholder="Nhập mật khẩu">

            <div class="terms">
                <input class="var"type="checkbox">
                <label> Bạn đồng ý với <a href="#">chính sách và điều khoản</a></label>
            </div>

            <button type="submit" class="register-btn">Đăng ký</button>

            <p class="login-link">
                Bạn đã có tài khoản? <a href="../PAGES/login.html">Đăng nhập</a>
            </p>
        </form>
    </div>
</body>
</html>
