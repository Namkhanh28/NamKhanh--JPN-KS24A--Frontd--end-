<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <link rel="stylesheet" href="../CSS/login.css">
</head>
<body>
    <div class="login-container">
        <h2 class="login-title">Đăng nhập</h2>
        <p class="login-subtitle">Đăng nhập tài khoản để sử dụng hệ thống quản lý.</p>

        <form class="login-form">
            <label for="email">Email</label>
            <input type="email" id="email">
            <label for="password">Mật khẩu</label>
            <input type="password" id="password">
            <div class="remember-forgot">
                <label><input type="checkbox"> Nhớ tài khoản</label>
                <a href="#" class="forgot-password">Quên mật khẩu?</a>
            </div>

            <button type="submit" class="login-btn"><a href="../PAGES/dashboard.html"> Đăng nhập</a></button>

            <p class="register-link">
                Bạn chưa có tài khoản? <a href="../PAGES/register.html">Đăng ký</a>
            </p>
        </form>
    </div>
</body>
</html>
